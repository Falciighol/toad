[workspace]
resolver = "2"
members = ["crates/toad-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
tokio-util = "0.7"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
