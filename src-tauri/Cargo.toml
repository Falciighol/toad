[package]
name = "toad"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop API load tester"

[lib]
name = "toad_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
toad-core = { path = "../crates/toad-core", features = ["specta"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta.workspace = true
specta-typescript = "0.0.13"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
